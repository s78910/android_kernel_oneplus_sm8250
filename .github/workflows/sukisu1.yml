name: Build OnePlus_SukiSU Ultra (4.19)
on:
  workflow_dispatch:
    inputs:
      FEIL:
        type: choice
        description: "配置文件"
        required: true
        default: oneplus_8t_android13 # 示例配置
        options:
          - oneplus_8t_android13
          - oneplus_9_pro_android13
      BUILD_METHOD:
        type: choice
        description: "编译方式"
        required: true
        default: perf
        options:
          - gki
          - perf
      SUSFS_CI:
        type: choice
        description: "SUSFS模块来源"
        required: true
        default: Release
        options:
          - CI
          - Release
      SUFFIX:
        type: string
        description: "自定义内核后缀"
        required: false
        default: ""
      VFS:
        type: boolean
        description: "启用手动钩子(VFS)"
        required: true
        default: true

jobs:
  get-config:
    uses: ./.github/workflows/feil-map.yml
    with:
      FEIL: ${{ inputs.FEIL }}
    secrets: inherit

  build:
    needs: get-config
    runs-on: ubuntu-latest
    env:
      CPU: ${{ needs.get-config.outputs.CPU }}
      ANDROID_VERSION: ${{ needs.get-config.outputs.ANDROID_VERSION }} # 自动获取
      KERNEL_VERSION: ${{ needs.get-config.outputs.KERNEL_VERSION }}
      CCACHE_MAXSIZE: 4G

    steps:
      # ... [保留基础步骤] ...
      
      # 核心修改：SUSFS 集成
      - name: Add KernelSU-SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          cd ./KernelSU
          KSU_VERSION=$(expr $(git rev-list --count main) "+" 10700)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV

      - name: Apply SUSFS Patches
        run: |
          cd kernel_workspace
          # 使用自动获取的 ANDROID_VERSION
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ env.ANDROID_VERSION }}-4.19
          
          cd kernel_platform/common
          patch -p1 < ../susfs4ksu/patches/50_add_susfs.patch

      - name: Configure Kernel
        run: |
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU=y" >> $CONFIG_FILE
          
          if ${{ inputs.VFS }}; then
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> $CONFIG_FILE
            echo "CONFIG_KSU_SUSFS=y" >> $CONFIG_FILE
          fi

      # 构建步骤
      - name: Build Kernel
        run: |
          cd kernel_workspace/kernel_platform
          ./build.sh ${{ inputs.BUILD_METHOD }}

      # ... [其他步骤保持不变] ...

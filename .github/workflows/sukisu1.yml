      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y python3 git curl ccache jq

      # 新增：确保目录存在并安装 repo
      - name: Install repo tool and setup workspace
        run: |
          # 确保内核工作空间目录存在
          sudo mkdir -p kernel_workspace
          sudo chown -R runner:runner kernel_workspace
          
          # 安装 repo 工具并验证
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod a+x /usr/local/bin/repo
          repo --version || { echo "repo 安装失败"; exit 1; }
          echo "repo 已成功安装"

      - name: Restore ccache
        uses: actions/cache@v3
        with:
          path: /home/runner/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # 修复后的同步步骤
      - name: Initialize repo and sync
        run: |
          # 确保目录存在
          mkdir -p kernel_workspace
          cd kernel_workspace
          
          # 显式设置 PATH 确保能找到 repo
          export PATH="/usr/local/bin:$PATH"
          echo "当前 PATH: $PATH"
          repo --version || { echo "repo 命令未找到!"; exit 1; }
          
          # 同步源码
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git -b refs/heads/oneplus/${{ needs.get-config.outputs.CPU }} -m ${{ github.event.inputs.FEIL }}.xml --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
          
          # 修复可能的配置文件问题
          if [ -e kernel_platform/common/BUILD.bazel ]; then
            sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/common/BUILD.bazel
          fi
          if [ -e kernel_platform/msm-kernel/BUILD.bazel ]; then
            sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/msm-kernel/BUILD.bazel
          fi
          rm kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"

      # 后续所有步骤保持不变...

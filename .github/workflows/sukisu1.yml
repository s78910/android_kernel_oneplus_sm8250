name: Build OnePlus_SukiSU Ultra (4.19)

on:
  workflow_dispatch:
    inputs:
      SUSFS_CI:
        type: choice
        description: "下载SUSFS模块方式"
        required: true
        default: Release
        options:
          - Release
          - CI
          - NoN
      SUFFIX:
        type: string
        description: "自定义内核后缀 (留空则使用随机字符串)"
        required: false
        default: ""
      VFS:
        type: boolean
        description: "是否启用手动钩子(VFS)？推荐开启"
        required: true
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "3G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: "vendor/kona-perf_defconfig"
      KERNEL_CMDLINE: "ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 O=out"
      ANDROID_VERSION: "13"
      KERNEL_VERSION: "4.19"
      
    steps:
    - name: Clean workspace
      run: |
        rm -rf kernel_workspace || true
        sudo swapoff -a || true
        rm -rf /swapfile || true
        mkdir kernel_workspace
        
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Create swap file
      run: |
        sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt install -y python3 git curl ccache jq gcc-aarch64-linux-gnu binutils make
        
    # 修复点：确保目录存在再进入
    - name: Initialize repo and sync
      run: |
        mkdir -p kernel_workspace  # 确保目录存在
        cd kernel_workspace
        repo init -u https://github.com/OnePlusOSS/kernel_manifest.git -b refs/heads/oneplus/sm8250 -m oneplus_8t_android13_4.19.xml --depth=1
        repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
        
        # 修复可能的配置文件问题
        rm kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
        rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"
      
    # ... 后续步骤保持不变 ...

name: Build OnePlus 8T Kernel with SukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v3
        with:
          repository: MYTHOSick/android_kernel_oneplus_sm8250
          ref: oss13
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils make python3 libssl-dev build-essential bc bison flex unzip ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs ccache
          git clone https://codeberg.org/Mandi-Sa/clang --depth=1 -b amd64-kernel-arm
          git clone https://github.com/lateautumn233/AnyKernel3 -b master --depth=1
          rm -rf AnyKernel3/.git

      - name: Integrate SukiSU (with susfs)
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main

      - name: Disable LZ4K/LZ4KD and lkm
        run: |
          sed -i '/CONFIG_LZ4K/d' arch/arm64/configs/vendor/kona-perf_defconfig || true
          sed -i '/CONFIG_LZ4KD/d' arch/arm64/configs/vendor/kona-perf_defconfig || true
          sed -i '/CONFIG_MODULES/d' arch/arm64/configs/vendor/kona-perf_defconfig || true
          echo '# 禁用LZ4K/LZ4KD和lkm' >> arch/arm64/configs/vendor/kona-perf_defconfig
          echo 'CONFIG_LZ4K=n' >> arch/arm64/configs/vendor/kona-perf_defconfig
          echo 'CONFIG_LZ4KD=n' >> arch/arm64/configs/vendor/kona-perf_defconfig
          echo 'CONFIG_MODULES=n' >> arch/arm64/configs/vendor/kona-perf_defconfig

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang/bin/:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make vendor/kona-perf_defconfig CC="ccache clang"
          make CC="ccache clang" -j$(nproc --all)
          cp out/arch/arm64/boot/Image.gz AnyKernel3/

      - name: Upload Kernel
        uses: actions/upload-artifact@v3
        with:
          name: OnePlus8T-SukiSU-Kernel
          path: AnyKernel3/*
